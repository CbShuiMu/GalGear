[package]
name = "galgear"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "galgear"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
galgear-core.workspace = true
galgear-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd = { version = "0.16", default-features = false }
reqwest = { version = "0.12", default-features = false }
open = "5"
base64 = "0.22"
sha2 = "0.10"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
tempfile = "3"
tokio = {version="1",features= ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
# Reuse the WebView2 bindings already used by Tauri to observe native process failures.
webview2-com = "0.38"
windows-core = "0.61"
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_HiDpi", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse"] }

