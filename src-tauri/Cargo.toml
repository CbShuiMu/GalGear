[package]
name = "galgear"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "galgear"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
galgear-core.workspace = true
galgear-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd = { version = "0.16", default-features = false }
reqwest = { version = "0.12", default-features = false }
open = "5"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
tokio = {version="1",features= ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }

