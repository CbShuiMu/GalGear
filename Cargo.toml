[workspace]
members = ["crates/i18n", "crates/core", "crates/ui", "src-tauri"]
default-members = ["crates/core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
galgear-core = { path = "crates/core" }
galgear-i18n = { path = "crates/i18n" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

